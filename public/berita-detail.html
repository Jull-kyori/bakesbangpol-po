<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Berita | Bakesbangpol Kabupaten Ponorogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-cream text-slate-800 antialiased">
  <header id="site-header" data-variant="solid"></header>

  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
    <a href="/berita.html" class="inline-flex items-center gap-2 text-sm font-semibold text-primary-dark hover:text-accent"><span aria-hidden="true">←</span> Kembali ke daftar berita</a>
    <article id="artikel" class="mt-6"><p class="text-slate-500">Memuat berita...</p></article>
    <section id="komentar-section" class="mx-auto mt-12 hidden max-w-4xl border-t border-ink/10 pt-8" aria-labelledby="komentar-title">
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <h2 id="komentar-title" class="text-2xl font-bold text-ink">Komentar <span id="komentar-total" class="text-lg font-normal text-slate-500">(0)</span></h2>
        <p class="text-sm text-slate-500">Komentar akan tampil setelah disetujui admin. <a href="/kebijakan.html" class="font-semibold text-primary-dark underline">Baca aturan dan privasi</a>.</p>
      </div>
      <form id="komentar-form" class="mt-5 rounded-xl bg-cream p-5 ring-1 ring-ink/10">
        <label for="komentar-nama" class="text-sm font-semibold text-ink">Nama tampilan</label>
        <input id="komentar-nama" maxlength="60" required autocomplete="name" class="mt-1 w-full rounded-lg border border-ink/20 bg-white px-3 py-2" />
        <label for="komentar-isi" class="mt-4 block text-sm font-semibold text-ink">Tulis komentar</label>
        <textarea id="komentar-isi" maxlength="1000" rows="4" required class="mt-1 w-full rounded-lg border border-ink/20 bg-white px-3 py-2" placeholder="Sampaikan pendapat dengan sopan..."></textarea>
        <input id="komentar-parent" type="hidden" />
        <div class="mt-3 flex flex-wrap items-center gap-3">
          <button id="komentar-kirim" class="rounded-lg bg-primary px-4 py-2 font-semibold text-ink hover:bg-accent hover:text-white">Kirim komentar</button>
          <button id="komentar-batal-balas" type="button" class="hidden rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 ring-1 ring-ink/20">Batal membalas</button>
          <span id="komentar-status" class="text-sm text-slate-600" role="status"></span>
        </div>
      </form>
      <ul id="komentar-list" class="mt-6 space-y-4"></ul>
    </section>
  </main>

  <section class="border-t border-ink/10 bg-white py-12">
    <div class="mx-auto max-w-7xl px-6">
      <h2 class="text-2xl font-bold text-ink">Berita lainnya</h2>
      <div id="lain" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </div>
  </section>

  <div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/85 p-4" role="dialog" aria-label="Foto diperbesar">
    <img id="lightbox-img" alt="" class="max-h-full max-w-full rounded-lg" />
  </div>

  <dialog id="lapor-dialog" class="w-[calc(100%-2rem)] max-w-lg rounded-xl p-0 shadow-2xl backdrop:bg-black/50">
    <form id="lapor-form" class="p-6">
      <h2 class="text-xl font-bold text-ink">Laporkan komentar</h2>
      <label for="lapor-alasan" class="mt-4 block text-sm font-semibold text-ink">Alasan</label>
      <select id="lapor-alasan" required class="mt-1 w-full rounded-lg border border-ink/20 bg-white px-3 py-2">
        <option value="Spam">Spam</option>
        <option value="Tidak pantas">Tidak pantas</option>
        <option value="Informasi keliru">Informasi keliru</option>
        <option value="Lainnya">Lainnya</option>
      </select>
      <label for="lapor-detail" class="mt-4 block text-sm font-semibold text-ink">Keterangan (opsional)</label>
      <textarea id="lapor-detail" maxlength="300" rows="3" class="mt-1 w-full rounded-lg border border-ink/20 px-3 py-2"></textarea>
      <div class="mt-5 flex justify-end gap-3">
        <button id="lapor-batal" type="button" class="rounded-lg px-4 py-2 font-semibold text-slate-600 ring-1 ring-ink/20">Batal</button>
        <button class="rounded-lg bg-primary px-4 py-2 font-semibold text-ink">Kirim laporan</button>
      </div>
    </form>
  </dialog>

  <footer id="site-footer"></footer>
  <script src="/js/layout.js"></script>
  <script>
    (async function () {
      const { esc, tanggal, cardBerita } = window.BK;
      const id = new URLSearchParams(location.search).get('id');
      const box = document.getElementById('artikel');
      let beritaAda = false;
      try {
        const r = await fetch('/api/berita/' + encodeURIComponent(id || ''));
        if (!r.ok) throw new Error();
        const b = await r.json();
        beritaAda = true;
        document.title = b.judul + ' | Bakesbangpol Kabupaten Ponorogo';
        const paragraf = esc(b.isi).split(/\n{2,}/)
          .map((p) => `<p class="mb-5">${p.replace(/\n/g, '<br>')}</p>`).join('');
        box.innerHTML = `
          <header class="mx-auto max-w-4xl">
            <p class="inline-flex rounded-full bg-primary/15 px-3 py-1 text-sm font-semibold text-primary-dark">${esc(b.kategori)}</p>
            <h1 class="mt-4 text-3xl font-bold leading-[1.15] tracking-tight text-ink sm:text-4xl md:text-5xl">${esc(b.judul)}</h1>
            <div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-b border-ink/10 pb-5">
              <p class="flex items-center gap-2 text-sm text-slate-500"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><time datetime="${esc(b.tanggal)}">${tanggal(b.tanggal)}</time></p>
              <div><button id="bagikan-berita" type="button" class="inline-flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-semibold text-primary-dark ring-1 ring-ink/15 transition hover:bg-primary/15 hover:ring-primary/40"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.7 6.8-4.4m-6.8 7 6.8 4.3"/></svg>Bagikan</button><span id="bagikan-status" class="ml-2 text-sm text-slate-500" role="status"></span></div>
            </div>
          </header>
          ${b.gambar ? `<img src="${esc(b.gambar)}" alt="" class="mt-7 max-h-[34rem] w-full rounded-2xl bg-ink/5 object-cover shadow-sm">` : ''}
          <div class="mx-auto mt-8 max-w-3xl text-base leading-8 text-slate-700 sm:text-lg sm:leading-9">${paragraf}</div>
          ${(b.galeri && b.galeri.length) ? `
            <section class="mx-auto mt-10 max-w-4xl">
            <h2 class="text-xl font-bold text-ink">Galeri foto</h2>
            <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3">
              ${b.galeri.map((src, i) => `<button type="button" data-src="${esc(src)}" class="overflow-hidden rounded-lg"><img src="${esc(src)}" alt="Foto ${i + 1} dari berita" loading="lazy" class="h-36 w-full object-cover transition hover:scale-105"></button>`).join('')}
            </div></section>` : ''}`;
      } catch {
        box.innerHTML = '<h1 class="text-3xl font-bold text-ink">Berita tidak ditemukan</h1><p class="mt-3 text-slate-600">Berita ini mungkin sudah dihapus. Lihat berita lain di <a class="font-semibold text-accent underline" href="/berita.html">daftar berita</a>.</p>';
      }

      const lb = document.getElementById('lightbox');
      box.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-src]');
        if (!btn) return;
        document.getElementById('lightbox-img').src = btn.dataset.src;
        lb.classList.remove('hidden');
        lb.classList.add('flex');
      });
      lb.addEventListener('click', () => { lb.classList.add('hidden'); lb.classList.remove('flex'); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.click(); });

      if (beritaAda) {
        const section = document.getElementById('komentar-section');
        const list = document.getElementById('komentar-list');
        const form = document.getElementById('komentar-form');
        const status = document.getElementById('komentar-status');
        const reportDialog = document.getElementById('lapor-dialog');
        const reportForm = document.getElementById('lapor-form');
        section.classList.remove('hidden');
        document.getElementById('komentar-nama').value = localStorage.getItem('bk-nama-komentar') || '';

        async function send(url, body) {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          let data;
          try { data = await response.json(); }
          catch { throw new Error('Respons server tidak valid. Silakan coba lagi.'); }
          if (!response.ok) throw new Error(data.error || 'Permintaan gagal. Silakan coba lagi.');
          return data;
        }

        function waktu(value) {
          return new Intl.DateTimeFormat('id-ID', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value));
        }

        async function loadComments() {
          const response = await fetch('/api/berita/' + encodeURIComponent(id) + '/komentar');
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Komentar tidak dapat dimuat.');
          document.getElementById('komentar-total').textContent = '(' + data.total + ')';
          const groups = new Map();
          data.items.forEach((item) => {
            const key = item.parentId || '';
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(item);
          });
          function render(parentId) {
            return (groups.get(parentId || '') || []).map((item) => `
              <li class="rounded-xl bg-white p-4 ring-1 ring-ink/10">
                <div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1">
                  <p class="font-semibold text-ink">${esc(item.nama)}</p>
                  <time class="text-xs text-slate-500" datetime="${esc(item.createdAt)}">${esc(waktu(item.createdAt))}</time>
                </div>
                <p class="mt-2 whitespace-pre-wrap break-words text-slate-700">${esc(item.isi)}</p>
                <div class="mt-3 flex flex-wrap gap-2 text-sm">
                  <button type="button" data-react="suka" data-id="${esc(item.id)}" aria-pressed="${item.reaksiSaya === 'suka'}" class="rounded-md px-2 py-1 ring-1 ring-ink/15 hover:bg-cream">Suka ${item.suka}</button>
                  <button type="button" data-react="tidak-suka" data-id="${esc(item.id)}" aria-pressed="${item.reaksiSaya === 'tidak-suka'}" class="rounded-md px-2 py-1 ring-1 ring-ink/15 hover:bg-cream">Tidak suka ${item.tidakSuka}</button>
                  <button type="button" data-reply="${esc(item.id)}" data-name="${esc(item.nama)}" class="rounded-md px-2 py-1 font-semibold text-primary-dark hover:bg-primary/15">Balas</button>
                  <button type="button" data-report="${esc(item.id)}" class="rounded-md px-2 py-1 text-slate-500 hover:bg-red-50 hover:text-red-700">Laporkan</button>
                </div>
                ${(groups.get(item.id) || []).length ? `<ul class="mt-4 space-y-3 border-l-2 border-primary/40 pl-3 sm:ml-4 sm:pl-4">${render(item.id)}</ul>` : ''}
              </li>`).join('');
          }
          const html = render('');
          list.innerHTML = html || '<li class="rounded-xl bg-white p-5 text-slate-600 ring-1 ring-ink/10">Belum ada komentar. Jadilah yang pertama berkomentar.</li>';
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const button = document.getElementById('komentar-kirim');
          const name = document.getElementById('komentar-nama');
          const textarea = document.getElementById('komentar-isi');
          button.disabled = true;
          status.textContent = 'Mengirim...';
          try {
            await send('/api/berita/' + encodeURIComponent(id) + '/komentar', {
              nama: name.value, isi: textarea.value, parentId: document.getElementById('komentar-parent').value
            });
            localStorage.setItem('bk-nama-komentar', name.value.trim());
            textarea.value = '';
            document.getElementById('komentar-parent').value = '';
            document.getElementById('komentar-batal-balas').classList.add('hidden');
            document.getElementById('komentar-kirim').textContent = 'Kirim komentar';
            status.textContent = 'Komentar terkirim dan menunggu persetujuan admin.';
            await loadComments();
          } catch (error) {
            status.textContent = error.message;
          } finally {
            button.disabled = false;
          }
        });

        document.getElementById('komentar-batal-balas').addEventListener('click', () => {
          document.getElementById('komentar-parent').value = '';
          document.getElementById('komentar-kirim').textContent = 'Kirim komentar';
          document.getElementById('komentar-batal-balas').classList.add('hidden');
        });

        list.addEventListener('click', async (e) => {
          const reaction = e.target.closest('[data-react]');
          const reply = e.target.closest('[data-reply]');
          const report = e.target.closest('[data-report]');
          try {
            if (reaction) {
              await send('/api/komentar/' + encodeURIComponent(reaction.dataset.id) + '/reaksi', { reaksi: reaction.dataset.react });
              await loadComments();
            } else if (reply) {
              document.getElementById('komentar-parent').value = reply.dataset.reply;
              document.getElementById('komentar-kirim').textContent = 'Kirim balasan';
              document.getElementById('komentar-batal-balas').classList.remove('hidden');
              status.textContent = 'Membalas ' + reply.dataset.name;
              document.getElementById('komentar-isi').focus();
              form.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (report) {
              reportForm.dataset.commentId = report.dataset.report;
              reportDialog.showModal();
            }
          } catch (error) {
            status.textContent = error.message;
          }
        });

        document.getElementById('lapor-batal').addEventListener('click', () => reportDialog.close());
        reportForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await send('/api/komentar/' + encodeURIComponent(reportForm.dataset.commentId) + '/laporan', {
              alasan: document.getElementById('lapor-alasan').value,
              detail: document.getElementById('lapor-detail').value
            });
            reportDialog.close();
            reportForm.reset();
            status.textContent = 'Laporan telah dikirim kepada admin.';
          } catch (error) {
            status.textContent = error.message;
          }
        });

        document.getElementById('bagikan-berita').addEventListener('click', async () => {
          const shareStatus = document.getElementById('bagikan-status');
          try {
            if (navigator.share) await navigator.share({ title: document.title, url: location.href });
            else {
              await navigator.clipboard.writeText(location.href);
              shareStatus.textContent = 'Tautan disalin.';
            }
          } catch (error) {
            if (error.name !== 'AbortError') shareStatus.textContent = 'Tidak dapat membagikan tautan dari browser ini.';
          }
        });

        try {
          await loadComments();
        } catch (error) {
          list.innerHTML = `<li class="text-sm text-red-700">${esc(error.message)}</li>`;
        }
      }

      try {
        const response = await fetch('/api/berita?limit=4');
        if (!response.ok) throw new Error('Berita terkait belum dapat dimuat.');
        const d = await response.json();
        if (!Array.isArray(d.items)) throw new Error('Respons berita terkait tidak valid.');
        const lain = d.items.filter((b) => b.id !== id).slice(0, 3);
        document.getElementById('lain').innerHTML = lain.map((b) => cardBerita(b)).join('');
      } catch {
        document.getElementById('lain').textContent = 'Berita terkait belum dapat dimuat.';
      }
    })();
  </script>
</body>
</html>
